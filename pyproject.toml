[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis_framework"
version = "1.0.0"
description = "Time-Series Forecasting Robustness Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chronos-forecasting>=2.2.0",
    "hydra-core>=1.3.2",
    "kaleido>=1.3.0",
    "numpy>=1.24.0",
    "omegaconf>=2.3.0",
    "pandas>=2.0.0",
    "plotly>=6.7.0",
    "pmdarima>=2.1.0",
    "prophet>=1.3.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "tqdm>=4.66.0",
    "wandb>=0.26.0",
    "xgboost>=2.0.0",
    "yfinance>=1.3.0"
]

[project.optional-dependencies]
torch-cpu = ["torch>=2.0.0"]
torch-gpu = ["torch>=2.0.0"]
